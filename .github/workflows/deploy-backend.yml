name: Deploy backend

# Fires on pushes to main that touch the server, plus a manual button.
# Client is deployed by Vercel, so client-only changes don't trigger this.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

# id-token: write is REQUIRED for OIDC — it lets the job mint the GitHub JWT
# that AWS trades for short-lived credentials. contents: read is the default
# minimum for checkout-less jobs.
permissions:
  id-token: write
  contents: read

# Never let two deploys run at once; queue them instead of clobbering.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # The actual deploy, run on the box AS ssm-user (SSM defaults to root).
          # su - loads ssm-user's login shell so pm2 is on PATH and talks to the
          # ssm-user pm2 daemon (not a stray root one). --ff-only fails loudly if
          # the box has drifted from origin instead of creating a merge commit.
          read -r -d '' REMOTE <<'EOF' || true
          su - ssm-user -c 'set -e; cd ~/MeetNote-AI/server && git pull --ff-only && npm install --no-audit --no-fund && pm2 restart meetnote'
          EOF

          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CD deploy ${GITHUB_SHA::7}" \
            --parameters commands="[$(jq -Rn --arg c "$REMOTE" '$c')]",executionTimeout=600 \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$cmd_id"

          # Wait for it to finish, then surface stdout/stderr and gate on Success.
          aws ssm wait command-executed \
            --command-id "$cmd_id" --instance-id "$INSTANCE_ID" || true

          status=$(aws ssm get-command-invocation \
            --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "SSM Status=$status"
          test "$status" = "Success"
