<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MeetNote" />

    <title>MeetNote AI — Record Meetings & Get AI-Written Notes</title>
    <meta
      name="description"
      content="MeetNote turns conversations into structured knowledge. Host real-time audio/video meetings, record them, and get accurate transcripts with AI-generated meeting notes automatically."
    />
    <meta
      name="keywords"
      content="AI meeting notes, meeting transcription, meeting recorder, video conferencing, real-time meetings, AI note taker, meeting summary"
    />
    <meta name="author" content="MeetNote" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://meet-note-ai.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MeetNote AI" />
    <meta property="og:url" content="https://meet-note-ai.vercel.app/" />
    <meta
      property="og:title"
      content="MeetNote AI — Record Meetings & Get AI-Written Notes"
    />
    <meta
      property="og:description"
      content="Host real-time meetings, record them, and get accurate transcripts with AI-generated meeting notes automatically."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dgm9tbtvf/image/upload/f_png,c_pad,b_rgb:111111,w_1200,h_630/meetnote/landing/Hero-Graphic.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="MeetNote AI — record meetings and get AI-written notes" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MeetNote AI — Record Meetings & Get AI-Written Notes"
    />
    <meta
      name="twitter:description"
      content="Host real-time meetings, record them, and get accurate transcripts with AI-generated meeting notes automatically."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/dgm9tbtvf/image/upload/f_png,c_pad,b_rgb:111111,w_1200,h_630/meetnote/landing/Hero-Graphic.png"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MeetNote AI",
        "url": "https://meet-note-ai.vercel.app/",
        "description": "Turn conversations into structured knowledge. Record meetings and get AI-written notes.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        if (
          stored === "dark" ||
          (!stored &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
