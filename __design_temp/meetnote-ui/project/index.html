<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeetNote — Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="modals.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-schedules.jsx"></script>
  <script type="text/babel" src="screen-history.jsx"></script>
  <script type="text/babel" src="screen-settings.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="auth.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const Canvas = () => (
      <DesignCanvas minScale={0.15} maxScale={3}>
        <DCSection id="marketing" title="Marketing site" subtitle="Public-facing landing & top-of-funnel">
          <DCArtboard id="landing" label="Landing page · scrollable" width={1440} height={2400}>
            <Landing />
          </DCArtboard>
        </DCSection>

        <DCSection id="auth" title="Authentication" subtitle="Centered minimal cards, dual-column layout">
          <DCArtboard id="signin" label="Sign in" width={1280} height={820}>
            <SignIn />
          </DCArtboard>
          <DCArtboard id="signup" label="Sign up" width={1280} height={820}>
            <SignUp />
          </DCArtboard>
        </DCSection>

        <DCSection id="app" title="Application" subtitle="Persistent sidebar + topbar. Navigate inside each artboard.">
          <DCArtboard id="home" label="Home · command center" width={1440} height={1100}>
            <AppHome />
          </DCArtboard>
          <DCArtboard id="schedules" label="Schedules · monthly calendar" width={1440} height={1100}>
            <AppSchedules />
          </DCArtboard>
          <DCArtboard id="history" label="Meeting histories" width={1440} height={1100}>
            <AppHistory />
          </DCArtboard>
          <DCArtboard id="settings" label="Settings · AI preferences" width={1440} height={1100}>
            <AppSettings />
          </DCArtboard>
          <DCArtboard id="profile" label="Profile" width={1440} height={1100}>
            <AppProfile />
          </DCArtboard>
        </DCSection>

        <DCSection id="overlays" title="Modals & overlays" subtitle="Inline-rendered in their natural context">
          <DCArtboard id="start-modal" label="Start meeting modal" width={1440} height={1000}>
            <AppStartModal />
          </DCArtboard>
          <DCArtboard id="schedule-modal" label="Schedule meeting modal" width={1440} height={1000}>
            <AppScheduleModal />
          </DCArtboard>
          <DCArtboard id="notifications" label="Notification slide-over" width={1440} height={1000}>
            <AppNotifications />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
  </script>
</body>
</html>
